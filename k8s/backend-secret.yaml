apiVersion: v1
kind: Secret
metadata:
  name: ai-backend-secret
  namespace: ai-saas

type: Opaque

stringData:
  DATABASE_URL: "postgresql://user:password@host:5432/database?sslmode=require"
  JWT_SECRET: "replace-with-long-random-jwt-secret"
  CLERK_SECRET_KEY: "replace-with-clerk-secret-key"
  CLERK_PUBLISHABLE_KEY: "replace-with-clerk-publishable-key"
  CLOUDINARY_CLOUD_NAME: "replace-with-cloudinary-cloud-name"
  CLOUDINARY_API_KEY: "replace-with-cloudinary-api-key"
  CLOUDINARY_API_SECRET: "replace-with-cloudinary-api-secret"
  OPENROUTER_API_KEY: "replace-with-openrouter-api-key"
  OPENROUTER_MODEL: "openai/gpt-4o-mini"
